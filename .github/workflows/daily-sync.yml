# Daily data syncs into the CRM, so they no longer depend on a laptop session
# (on 2 Nov the data was 3 days stale). Each script is safe to re-run.
#
# Why GitHub Actions, not a Netlify Scheduled Function: those stop at 30
# seconds, and on 2 Nov the GHL import and attribution took 2m10s each
# (15,880 contacts, paged at 100) and the Meta sync 28s. The repo is public,
# so Actions minutes are free; the job limit is 6 hours.
#
# Secrets (repo Settings > Secrets and variables > Actions): DATABASE_URL,
# LMS_DATABASE_URL, META_ACCESS_TOKEN, META_AD_ACCOUNT_ID, META_CAPI_TOKEN,
# META_DATASET_ID (the dataset linked to the WhatsApp account), META_WABA_ID,
# SALESPROCESS_API_TOKEN, SALESPROCESS_LOCATION_ID, WATI_API_HOST,
# WATI_API_TOKEN.
#
# Logs are public: scripts print counts only, and scripts/ci-errors.mjs keeps
# an uncaught error to its message.
name: daily-sync

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 MYT
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --import=./scripts/ci-errors.mjs scripts/sync-meta-ads.ts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      # Link new campaigns to their class for Home's opt-ins (12 Nov), after
      # the Meta sync has brought in today's campaigns.
      - run: node --import=./scripts/ci-errors.mjs scripts/link-class-campaigns.ts --apply
        env:
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}

  # Click-to-WhatsApp opt-ins from WATI. --since 3 days overlaps the last
  # runs, so a missed night is caught up; re-runs add nothing twice.
  wati-ctwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --import=./scripts/ci-errors.mjs scripts/sync-wati-ctwa.ts --apply
        env:
          WATI_API_HOST: ${{ secrets.WATI_API_HOST }}
          WATI_API_TOKEN: ${{ secrets.WATI_API_TOKEN }}

  # After wati-ctwa, so last night's opt-ins go out in the same run.
  meta-capi:
    needs: wati-ctwa
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --import=./scripts/ci-errors.mjs scripts/send-meta-capi.ts --apply --live
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_DATASET_ID: ${{ secrets.META_DATASET_ID }}
          META_WABA_ID: ${{ secrets.META_WABA_ID }}

  lms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --import=./scripts/ci-errors.mjs scripts/sync-lms.ts --apply
        env:
          LMS_DATABASE_URL: ${{ secrets.LMS_DATABASE_URL }}

  ghl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SALESPROCESS_API_TOKEN: ${{ secrets.SALESPROCESS_API_TOKEN }}
      SALESPROCESS_LOCATION_ID: ${{ secrets.SALESPROCESS_LOCATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      # Attribution matches only people the import has already created.
      - run: node --import=./scripts/ci-errors.mjs scripts/import-ghl-contacts.ts --from-api --apply
      - run: node --import=./scripts/ci-errors.mjs scripts/import-ghl-attribution.ts --apply --accept-approx-dates
      - run: node --import=./scripts/ci-errors.mjs scripts/sync-salesprocess-payments.ts --apply
      - run: node --import=./scripts/ci-errors.mjs scripts/import-salesprocess-enrolments.ts --apply
      # Workshop registrations for Home's Free workshops (12 Nov). Last in the
      # job, so a failure here never stops payments or enrolments.
      - run: node --import=./scripts/ci-errors.mjs scripts/import-ghl-forms.ts --apply
