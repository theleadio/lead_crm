# Netlify had no build command, so every deploy published the repo root as
# static files: 16 seconds, 0 functions, and the app never ran (PR #6 deploy
# 6ad5ca21, "No build steps found, continuing to publishing").
#
# @netlify/plugin-nextjs is installed by Netlify itself and updated every
# build, so it is deliberately not declared or pinned here.

[build]
  command = "npm run build"
  publish = ".next"

# Netlify's secrets scan failed the build (PR #19) on values that are not
# secret or not published: NEXT_PUBLIC_* are inlined into the browser bundle
# by design, and the Turbopack cache is build-time only. Every other key and
# path is still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
